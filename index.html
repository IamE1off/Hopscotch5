<body>
  <div id="__bundler_placeholder">Loading Vanishing dialogues...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"c0425dda-be42-4d26-be19-bb46e1263412\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"3310b121-cda2-45ea-8060-cd85c984627d\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"c0425dda-be42-4d26-be19-bb46e1263412\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nbody{margin:0}\n.tk{font:inherit;font-size:22px;line-height:1.3;border:0;margin:2px 3px 2px 0;padding:2px 6px;border-radius:6px;cursor:pointer;font-family:\"Figtree\",system-ui,sans-serif}\n.tk:disabled{cursor:default}\n.tk:not(:disabled):hover{outline:2px solid #2a55e0}\n.btn{font:inherit;font-size:15px;font-weight:600;font-family:\"Figtree\",system-ui,sans-serif;min-height:44px;padding:8px 16px;border-radius:10px;border:1px solid #9fb0d0;background:#fff;color:#14213d;cursor:pointer}\n.btn:hover{background:#e4eaf4}\n.btn:disabled{opacity:.4;cursor:default}\nbutton:focus-visible{outline:3px solid #2a55e0;outline-offset:2px}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height: 1000px; box-sizing: border-box; background: #eef2f8; padding: 32px 20px 56px; font-family: 'Figtree', system-ui, sans-serif; color: #14213d\" data-canvas-width=\"900\" data-canvas-height=\"1000\" data-document-role=\"page\" data-label=\"Vanishing dialogues\">\n<div style=\"max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px\">\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<span style=\"font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #52627f\">Hopscotch 5<\u002Fspan>\n<h1 style=\"margin: 0; font-family: 'Bricolage Grotesque', 'Trebuchet MS', sans-serif; font-weight: 800; font-size: 40px; line-height: 1.05; letter-spacing: -.01em\">Study room<\u002Fh1>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 8px; padding: 4px; background: #e4eaf4; border-radius: 14px; align-self: flex-start\">\n<sc-for list=\"{{sections}}\" as=\"sec\" hint-placeholder-count=\"2\">\n<button type=\"button\" class=\"btn\" style=\"{{sec.style}}\" aria-pressed=\"{{sec.on}}\" sc-camel-on-click=\"{{sec.pick}}\">{{sec.label}}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<sc-if value=\"{{showCards}}\" hint-placeholder-val=\"{{true}}\">\n<div style=\"display: flex; flex-direction: column; gap: 18px\">\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px\">Word cards<\u002Fh2>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n<sc-for list=\"{{setTabs}}\" as=\"t\" hint-placeholder-count=\"2\">\n<button type=\"button\" class=\"btn\" style=\"{{t.style}}\" aria-pressed=\"{{t.on}}\" sc-camel-on-click=\"{{t.pick}}\">{{t.label}}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between\">\n<div style=\"display: flex; gap: 8px; flex-wrap: wrap\">\n<sc-for list=\"{{modeTabs}}\" as=\"m\" hint-placeholder-count=\"2\">\n<button type=\"button\" class=\"btn\" style=\"{{m.style}}\" aria-pressed=\"{{m.on}}\" sc-camel-on-click=\"{{m.pick}}\">{{m.label}}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n<button type=\"button\" class=\"btn\" style=\"{{onlyStyle}}\" aria-pressed=\"{{only}}\" disabled=\"{{onlyDisabled}}\" sc-camel-on-click=\"{{toggleOnly}}\">{{onlyLabel}}<\u002Fbutton>\n<button type=\"button\" class=\"btn\" sc-camel-on-click=\"{{shuffle}}\">Shuffle<\u002Fbutton>\n<button type=\"button\" class=\"btn\" sc-camel-on-click=\"{{resetCards}}\">Reset<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px\">\n<sc-for list=\"{{squares}}\" as=\"sq\" hint-placeholder-count=\"12\">\n<button type=\"button\" style=\"{{sq.style}}\" sc-camel-on-click=\"{{sq.pick}}\">{{sq.n}}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<p style=\"margin: 0; font-size: 14px; color: #52627f\" aria-live=\"polite\">{{progressText}}<\u002Fp>\n<sc-if value=\"{{inPlay}}\" hint-placeholder-val=\"{{true}}\">\n<div style=\"background: #fff; border: 1px solid #cfd8e8; border-radius: 18px; box-shadow: 0 1px 2px rgba(20,33,61,.08), 0 10px 30px rgba(20,33,61,.08); padding: 26px 24px; min-height: 300px; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px\">\n<span style=\"font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #52627f; border: 1px solid #cfd8e8; padding: 3px 9px; border-radius: 99px\">{{tagText}}<\u002Fspan>\n<button type=\"button\" class=\"btn\" style=\"{{starStyle}}\" aria-pressed=\"{{isStarred}}\" aria-label=\"Star this card to study it later\" sc-camel-on-click=\"{{toggleStar}}\">{{starIcon}}<\u002Fbutton>\n<\u002Fdiv>\n<sc-if value=\"{{showFrontWord}}\">\n<sc-if value=\"{{card.hasPic}}\"><img src=\"{{card.pic}}\" alt=\"\" style=\"width: 160px; height: 160px; align-self: center; border-radius: 14px\"><\u002Fsc-if>\n<p style=\"margin: auto 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 56px; line-height: 1.02; overflow-wrap: anywhere\">{{card.word}}<\u002Fp>\n<\u002Fsc-if>\n<sc-if value=\"{{showFrontMeaning}}\">\n<p style=\"margin: auto 0 0; font-size: 26px; font-weight: 600; line-height: 1.25\">{{card.meaning}}<\u002Fp>\n<p style=\"margin: 0 0 auto; padding-left: 14px; border-left: 3px solid #2a55e0; font-size: 18px\">{{card.exBefore}}<span style=\"display: inline-block; min-width: 6ch; border-bottom: 2px solid #14213d\"><\u002Fspan>{{card.exAfter}}<\u002Fp>\n<\u002Fsc-if>\n<sc-if value=\"{{isBack}}\">\n<sc-if value=\"{{card.hasPic}}\"><img src=\"{{card.pic}}\" alt=\"\" style=\"width: 130px; height: 130px; align-self: center; border-radius: 14px\"><\u002Fsc-if>\n<p style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 38px; line-height: 1.05; overflow-wrap: anywhere\">{{card.word}}<\u002Fp>\n<p style=\"margin: 0; font-size: 19px; font-weight: 500\">{{card.meaning}}<\u002Fp>\n<p style=\"margin: 0; padding-left: 14px; border-left: 3px solid #2a55e0; font-size: 18px\">{{card.exBefore}}<mark style=\"background: #ffd84d; color: #14213d; padding: 0 3px; border-radius: 3px\">{{card.exHl}}<\u002Fmark>{{card.exAfter}}<\u002Fp>\n<sc-if value=\"{{card.hasTrick}}\"><p style=\"margin: 0; font-size: 16px\"><b style=\"font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #52627f\">Trick<\u002Fb> &nbsp;{{card.trick}}<\u002Fp><\u002Fsc-if>\n<div><button type=\"button\" class=\"btn\" style=\"min-height: 36px; padding: 4px 12px; font-size: 14px; color: #2a55e0; border-style: dashed; border-color: #2a55e0\" aria-expanded=\"{{moreOpen}}\" sc-camel-on-click=\"{{toggleMore}}\">{{moreLabel}}<\u002Fbutton><\u002Fdiv>\n<sc-if value=\"{{moreOpen}}\">\n<div style=\"display: flex; flex-direction: column; gap: 4px; font-size: 16px\">\n<span><b style=\"font-size: 12px; color: #52627f\">UA<\u002Fb> &nbsp;{{card.ua}}<\u002Fspan>\n<span><b style=\"font-size: 12px; color: #52627f\">ES<\u002Fb> &nbsp;{{card.es}}<\u002Fspan>\n<span><b style=\"font-size: 12px; color: #52627f\">ZH<\u002Fb> &nbsp;{{card.zh}}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fsc-if>\n<\u002Fdiv>\n<button type=\"button\" class=\"btn\" sc-camel-on-click=\"{{flip}}\">{{flipLabel}}<\u002Fbutton>\n<div style=\"display: flex; justify-content: center; align-items: center; gap: 16px\">\n<button type=\"button\" class=\"btn\" style=\"width: 72px; font-size: 24px\" aria-label=\"Previous card\" disabled=\"{{atStart}}\" sc-camel-on-click=\"{{prev}}\">←<\u002Fbutton>\n<span style=\"font-size: 15px; color: #52627f; min-width: 90px; text-align: center\">{{progressText}}<\u002Fspan>\n<button type=\"button\" class=\"btn\" style=\"width: 72px; font-size: 24px\" aria-label=\"Next card\" disabled=\"{{atEnd}}\" sc-camel-on-click=\"{{next}}\">→<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{isDone}}\">\n<div style=\"background: #fff; border: 1px solid #cfd8e8; border-radius: 18px; padding: 30px 24px; display: flex; flex-direction: column; gap: 14px\">\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px\">All words done.<\u002Fh2>\n<p style=\"margin: 0; color: #52627f\">{{doneNote}}<\u002Fp>\n<div><button type=\"button\" class=\"btn\" style=\"background: #2a55e0; color: #fff; border-color: #2a55e0\" sc-camel-on-click=\"{{resetCards}}\">Study again<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{showSongs}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"display: flex; flex-direction: column; gap: 14px\">\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px\">Grammar songs<\u002Fh2>\n<div style=\"position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 18px; overflow: hidden; background: #14213d; border: 1px solid #cfd8e8\">\n<iframe src=\"https://www.youtube-nocookie.com/embed/pyv5K06z-PE?playlist=pyv5K06z-PE&amp;loop=1&amp;iv_load_policy=3\" title=\"Grammar song video\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; border: 0\" loading=\"lazy\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\" referrerpolicy=\"strict-origin-when-cross-origin\" allowfullscreen=\"\"><\u002Fiframe>\n<\u002Fdiv>\n<p style=\"margin: 0; font-size: 14px; color: #52627f\">Video not showing? <a href=\"https://www.youtube.com/watch?v=pyv5K06z-PE\" target=\"_blank\" rel=\"noopener\" style=\"color: #2a55e0; font-weight: 600\">Open it on YouTube<\u002Fa>.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{showGames}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"display: flex; flex-direction: column; gap: 18px\">\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px\">Games<\u002Fh2>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n<sc-for list=\"{{gameTabs}}\" as=\"gt\" hint-placeholder-count=\"2\">\n<button type=\"button\" class=\"btn\" style=\"{{gt.style}}\" aria-pressed=\"{{gt.on}}\" sc-camel-on-click=\"{{gt.pick}}\">{{gt.label}}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n<sc-for list=\"{{gameSetTabs}}\" as=\"gs\" hint-placeholder-count=\"2\">\n<button type=\"button\" class=\"btn\" style=\"{{gs.style}}\" aria-pressed=\"{{gs.on}}\" sc-camel-on-click=\"{{gs.pick}}\">{{gs.label}}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<button type=\"button\" class=\"btn\" sc-camel-on-click=\"{{newGame}}\">New game<\u002Fbutton>\n<\u002Fdiv>\n<p style=\"margin: 0; font-size: 16px; font-weight: 600\" aria-live=\"polite\">{{gameStatus}}<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px\">\n<sc-for list=\"{{gtiles}}\" as=\"g\" hint-placeholder-count=\"12\">\n<button type=\"button\" style=\"{{g.style}}\" disabled=\"{{g.done}}\" aria-label=\"{{g.aria}}\" sc-camel-on-click=\"{{g.pick}}\"><sc-if value=\"{{g.hasPic}}\"><img src=\"{{g.pic}}\" alt=\"\" style=\"width: 64px; height: 64px; display: block; margin: 0 auto\"><\u002Fsc-if>{{g.label}}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{showDialogues}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"display: flex; flex-direction: column; gap: 20px\">\n<div>\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px\">Talking about preferences<\u002Fh2>\n<p style=\"margin: 6px 0 0; font-size: 16px; color: #52627f\">Unit 1c. Tap a word or phrase to turn it into a blank, then read the dialogue aloud from memory.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n<sc-for list=\"{{tabs}}\" as=\"tab\" hint-placeholder-count=\"3\">\n<button type=\"button\" class=\"btn\" style=\"{{tab.style}}\" aria-pressed=\"{{tab.on}}\" sc-camel-on-click=\"{{tab.pick}}\">{{tab.label}}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between\">\n<div style=\"display: flex; gap: 8px; flex-wrap: wrap\">\n<sc-for list=\"{{grans}}\" as=\"g\" hint-placeholder-count=\"2\">\n<button type=\"button\" class=\"btn\" style=\"{{g.style}}\" aria-pressed=\"{{g.on}}\" sc-camel-on-click=\"{{g.pick}}\">{{g.label}}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 8px; flex-wrap: wrap\">\n<button type=\"button\" class=\"btn\" sc-camel-on-click=\"{{hideSome}}\">Hide some<\u002Fbutton>\n<button type=\"button\" class=\"btn\" sc-camel-on-click=\"{{hideAll}}\">Hide all<\u002Fbutton>\n<button type=\"button\" class=\"btn\" sc-camel-on-click=\"{{showAll}}\">Show all<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<p style=\"margin: 0; font-size: 14px; color: #52627f\" aria-live=\"polite\">{{countText}}<\u002Fp>\n\n<div style=\"background: #fff; border: 1px solid #cfd8e8; border-radius: 18px; box-shadow: 0 1px 2px rgba(20,33,61,.08), 0 10px 30px rgba(20,33,61,.08); padding: 22px 20px; display: flex; flex-direction: column; gap: 14px\">\n<sc-for list=\"{{lines}}\" as=\"line\" hint-placeholder-count=\"6\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline\">\n<div style=\"flex: 0 0 120px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 19px; color: #2a55e0\">{{line.speaker}}<\u002Fdiv>\n<div style=\"flex: 1 1 280px; min-width: 0\">\n<sc-for list=\"{{line.toks}}\" as=\"tok\" hint-placeholder-count=\"5\">\n<button type=\"button\" class=\"tk\" style=\"{{tok.style}}\" disabled=\"{{tok.static}}\" aria-pressed=\"{{tok.hid}}\" sc-camel-on-click=\"{{tok.pick}}\">{{tok.label}}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<p style=\"margin: 0; font-size: 14px; color: #52627f\">Tap a blank line to bring the words back.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:1000}}\">\n  var FAMILY = [\n    { id: \"nephew\", word: \"nephew\", pos: \"noun\", meaning: \"The son of your brother or sister.\", example: \"My *nephew* is five years old.\", trick: \"nep-HE-w has \\\"he\\\" inside, so it is a boy.\", ua: \"племінник\", es: \"sobrino\", zh: \"侄子 zhízi (брат) · 外甥 wàisheng (сестра)\" },\n    { id: \"niece\", word: \"niece\", pos: \"noun\", meaning: \"The daughter of your brother or sister.\", example: \"My *niece* loves drawing.\", trick: \"niece sounds like nice: my nice niece.\", ua: \"племінниця\", es: \"sobrina\", zh: \"侄女 zhínǚ · 外甥女 wàishengnǚ\" },\n    { id: \"stepmother\", word: \"stepmother\", pos: \"noun\", meaning: \"The woman your father marries after your mother.\", example: \"Her *stepmother* makes great soup.\", trick: \"She \\\"steps\\\" into the family.\", ua: \"мачуха\", es: \"madrastra\", zh: \"继母 jìmǔ\" },\n    { id: \"stepfather\", word: \"stepfather\", pos: \"noun\", meaning: \"The man your mother marries after your father.\", example: \"His *stepfather* plays football with him.\", trick: \"A new dad who \\\"steps\\\" into the family.\", ua: \"вітчим\", es: \"padrastro\", zh: \"继父 jìfù\" },\n    { id: \"only-child\", word: \"only child\", pos: \"noun phrase\", meaning: \"A child with no brothers or sisters.\", example: \"I am an *only child*, so I have no brothers or sisters.\", trick: \"Only = just one. One child in the house.\", ua: \"єдина дитина\", es: \"hijo único / hija única\", zh: \"独生子女 dúshēng zǐnǚ\" },\n    { id: \"twin\", word: \"twin\", pos: \"noun\", meaning: \"One of two children born at the same time to the same mother.\", example: \"My *twin* brother has the same birthday as me.\", trick: \"twin starts like two and twice.\", ua: \"близнюк, близнючка\", es: \"gemelo / gemela\", zh: \"双胞胎 shuāngbāotāi\" },\n    { id: \"husband\", word: \"husband\", pos: \"noun\", meaning: \"The man you are married to.\", example: \"Her *husband* is a doctor.\", trick: \"Husband starts with H, like \\\"he\\\".\", ua: \"чоловік (у шлюбі)\", es: \"marido, esposo\", zh: \"丈夫 zhàngfu\" },\n    { id: \"wife\", word: \"wife\", pos: \"noun\", meaning: \"The woman you are married to. Plural: wives.\", example: \"His *wife* is a teacher.\", trick: \"One wife, two wives: f changes to v.\", ua: \"дружина\", es: \"esposa, mujer\", zh: \"妻子 qīzi\" },\n    { id: \"aunt\", word: \"aunt\", pos: \"noun\", meaning: \"The sister of your mother or father, or the wife of your uncle.\", example: \"My *aunt* is a nurse.\", trick: \"Say it like \\\"ant\\\". A little ant at the family picnic.\", ua: \"тітка\", es: \"tía\", zh: \"姑姑 gūgu (сестра батька) · 姨妈 yímā (сестра матері)\" },\n    { id: \"uncle\", word: \"uncle\", pos: \"noun\", meaning: \"The brother of your mother or father, or the husband of your aunt.\", example: \"My *uncle* has two cats.\", trick: \"Think of Uncle Sam: a man in the family.\", ua: \"дядько\", es: \"tío\", zh: \"叔叔 shūshu (брат батька) · 舅舅 jiùjiu (брат матері)\" },\n    { id: \"grandchild\", word: \"grandchild\", pos: \"noun\", meaning: \"The child of your son or daughter. A grandson or a granddaughter.\", example: \"She has three *grandchildren*.\", trick: \"grand + child: the child of your child.\", ua: \"онук, онука\", es: \"nieto / nieta\", zh: \"孙子 sūnzi (від сина) · 外孙 wàisūn (від доньки)\" },\n    { id: \"grandparent\", word: \"grandparent\", pos: \"noun\", meaning: \"The mother or father of your mother or father.\", example: \"My *grandparents* live in a small village.\", trick: \"grand + parent: the parent of your parent.\", ua: \"дідусь або бабуся\", es: \"abuelo / abuela\", zh: \"祖父母 zǔfùmǔ (батьки батька) · 外祖父母 wàizǔfùmǔ (батьки матері)\" }\n  ];\n\n  var BEES = [\n    { id: \"beekeeper\", word: \"beekeeper\", pos: \"noun\", meaning: \"A person who keeps bees and collects honey.\", example: \"The *beekeeper* wears a white suit.\", trick: \"bee + keeper, like a goalkeeper keeps the goal.\", ua: \"бджоляр\", es: \"apicultor / apicultora\", zh: \"养蜂人 yǎngfēngrén\" },\n    { id: \"beehive\", word: \"beehive\", pos: \"noun\", meaning: \"A home for bees. Plural: beehives.\", example: \"The *beehives* are at the end of the garden.\", trick: \"bee + hive: a house for bees.\", ua: \"вулик\", es: \"colmena\", zh: \"蜂箱 fēngxiāng\" },\n    { id: \"ill\", word: \"ill\", pos: \"adjective\", meaning: \"Not well. Sick.\", example: \"I stayed at home because I was *ill*.\", trick: \"ill is the opposite of healthy. Think: ill = in bed.\", ua: \"хворий\", es: \"enfermo / enferma\", zh: \"生病的 shēngbìng de\" },\n    { id: \"healthy\", word: \"healthy\", pos: \"adjective\", meaning: \"Strong and well. Not ill.\", example: \"Fruit and sport keep you *healthy*.\", trick: \"health + y: full of health.\", ua: \"здоровий\", es: \"sano / sana\", zh: \"健康的 jiànkāng de\" },\n    { id: \"angry\", word: \"angry\", pos: \"adjective\", meaning: \"Very cross because something is wrong or unfair.\", example: \"He was *angry* because the bus was late.\", trick: \"angry has \\\"anger\\\" inside.\", ua: \"сердитий, злий\", es: \"enfadado / enfadada\", zh: \"生气的 shēngqì de\" },\n    { id: \"honey\", word: \"honey\", pos: \"noun\", meaning: \"A sweet, sticky, golden food made by bees.\", example: \"I put *honey* in my tea.\", trick: \"Honey is also a sweet name for someone you love.\", ua: \"мед\", es: \"miel\", zh: \"蜂蜜 fēngmì\" },\n    { id: \"calm\", word: \"calm\", pos: \"adjective\", meaning: \"Quiet and relaxed. Not angry or worried.\", example: \"Stay *calm*! Everything is fine.\", trick: \"The L is silent, so the word is quiet too: \\\"cahm\\\".\", ua: \"спокійний\", es: \"tranquilo / tranquila\", zh: \"平静的 píngjìng de\" },\n    { id: \"patient\", word: \"patient\", pos: \"adjective\", meaning: \"Able to wait without getting angry.\", example: \"Be *patient*. The bus is coming.\", trick: \"A patient at the doctor's also waits a lot. (Patient can be a noun, too.)\", ua: \"терплячий\", es: \"paciente\", zh: \"有耐心的 yǒu nàixīn de\" },\n    { id: \"scared\", word: \"scared\", pos: \"adjective\", meaning: \"Afraid.\", example: \"I am *scared* of big dogs.\", trick: \"A scary film makes you scared.\", ua: \"наляканий\", es: \"asustado / asustada\", zh: \"害怕的 hàipà de\" },\n    { id: \"hard-working\", word: \"hard-working\", pos: \"adjective\", meaning: \"Always working a lot and trying hard.\", example: \"She is *hard-working*, so she gets good marks.\", trick: \"hard + working. Think of a busy bee.\", ua: \"працьовитий\", es: \"trabajador / trabajadora\", zh: \"勤奋的 qínfèn de\" },\n    { id: \"bored\", word: \"bored\", pos: \"adjective\", meaning: \"Unhappy because something is not interesting.\", example: \"I was *bored* in the long lesson.\", trick: \"I am bored. The lesson is boring.\", ua: \"якому нудно\", es: \"aburrido / aburrida\", zh: \"无聊的 wúliáo de\" },\n    { id: \"excited\", word: \"excited\", pos: \"adjective\", meaning: \"Very happy and full of energy about something.\", example: \"The children are *excited* about the trip.\", trick: \"Excited like a bee that cannot stop buzzing.\", ua: \"у захваті, схвильований\", es: \"emocionado / emocionada\", zh: \"兴奋的 xīngfèn de\" },\n    { id: \"happy\", word: \"happy\", pos: \"adjective\", meaning: \"Feeling good and glad.\", example: \"She is *happy* because it is her birthday.\", trick: \"Two P's look like two smiling cheeks.\", ua: \"щасливий\", es: \"feliz, contento / contenta\", zh: \"开心的 kāixīn de\" },\n    { id: \"sad\", word: \"sad\", pos: \"adjective\", meaning: \"Unhappy.\", example: \"He felt *sad* when his friend moved away.\", trick: \"Say it slowly with a long face: saaad.\", ua: \"сумний\", es: \"triste\", zh: \"难过的 nánguò de\" },\n    { id: \"worried\", word: \"worried\", pos: \"adjective\", meaning: \"Afraid that something bad will happen.\", example: \"Mum is *worried* because I am late.\", trick: \"worry changes to worried: y becomes ied.\", ua: \"стурбований\", es: \"preocupado / preocupada\", zh: \"担心的 dānxīn de\" },\n    { id: \"brave\", word: \"brave\", pos: \"adjective\", meaning: \"Not afraid of danger.\", example: \"The firefighter was very *brave*.\", trick: \"brave rhymes with save: brave people save others.\", ua: \"сміливий, відважний\", es: \"valiente\", zh: \"勇敢的 yǒnggǎn de\" },\n    { id: \"late\", word: \"late\", pos: \"adjective\", meaning: \"After the right time.\", example: \"I am sorry I am *late* for the lesson.\", trick: \"The opposite of on time. Do not mix it up with lately.\", ua: \"запізнілий, пізно\", es: \"tarde\", zh: \"晚 wǎn · 迟到 chídào (бути запізнілим)\" },\n    { id: \"punctual\", word: \"punctual\", pos: \"adjective\", meaning: \"Always on time.\", example: \"My teacher is very *punctual*.\", trick: \"punct- is like a point: you arrive at the exact point in time.\", ua: \"пунктуальний\", es: \"puntual\", zh: \"守时的 shǒushí de\" },\n    { id: \"lazy\", word: \"lazy\", pos: \"adjective\", meaning: \"Not wanting to work or to do anything.\", example: \"The cat is *lazy*. It sleeps all day.\", trick: \"lazy has a Z, like zzz when you sleep.\", ua: \"лінивий\", es: \"perezoso / perezosa\", zh: \"懒惰的 lǎnduò de\" },\n    { id: \"nice\", word: \"nice\", pos: \"adjective\", meaning: \"Kind and friendly, or pleasant.\", example: \"Our neighbour is very *nice*.\", trick: \"A nice person says please and thank you.\", ua: \"приємний, добрий\", es: \"amable, simpático / simpática\", zh: \"友善的 yǒushàn de\" },\n    { id: \"optimistic\", word: \"optimistic\", pos: \"adjective\", meaning: \"Always thinking that good things will happen.\", example: \"She is *optimistic* about the exam.\", trick: \"opti- is like optimum, the best: you expect the best.\", ua: \"оптимістичний\", es: \"optimista\", zh: \"乐观的 lèguān de\" }\n  ];\n\nconst P = (s) => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);\nconst S = (b) => P(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>${b}<\u002Fsvg>`);\nconst E = (e) => S(`<text x='50' y='76' font-size='78' text-anchor='middle'>${e}<\u002Ftext>`);\nconst HALLOWEEN = [\n { id: 'h1', word: 'haunted', pos: 'adjective', meaning: 'A haunted place has ghosts in it.', example: 'That old house is *haunted*.', trick: 'Ghosts haunt the house at night.', ua: 'з привидами', es: 'embrujado', zh: '闹鬼的', pic: S(`<rect width='100' height='100' rx='12' fill='#2b2d5b'/><circle cx='78' cy='22' r='9' fill='#ffe68a'/><path d='M20 90V50l30-22 30 22v40z' fill='#4a3b6b'/><path d='M14 52L50 22l36 30' fill='none' stroke='#1c1636' stroke-width='6'/><rect x='42' y='66' width='16' height='24' fill='#1c1636'/><rect x='27' y='55' width='11' height='11' fill='#ffd84d'/><rect x='62' y='55' width='11' height='11' fill='#ffd84d'/>`) },\n { id: 'h2', word: 'floor', pos: n];\n\nfunction ex(set, only, st) { const e = {}; if (only) set.cards.forEach((c) => { if (!st[c.id]) e[c.id] = true; }); return e; }\nfunction mk(cards) {\n  const p = bq(cards, {}, true).slice(0, 6), t = [];\n  p.forEach((id) => { const c = cards.filter((x) => x.id === id)[0]; t.push({ id: id, kind: \"w\", text: c.word }); t.push({ id: id, kind: \"m\", text: c.meaning, pic: c.pic || \"\" }); });\n  for (let i = t.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const x = t[i]; t[i] = t[j]; t[j] = x; }\n  return t;\n}\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { section: \"cards\", setIdx: 0, pos: 0, game: \"match\", tiles: mk(FAMILY), sel: [], gm: {}, tries: 0, busy: false, only: false, starred: { family: {}, bees: {} }, mode: \"word\", flipped: false, more: false, retries: 0, known: { family: {}, bees: {} }, queue: bq(FAMILY, {}, false), d: 0, gran: \"phrases\", hidden: {} };\n  }\n  renderVals() {\n    const s = this.state, keys = [];\n    const on = \"background:#14213d;color:#fff;border-color:#14213d;\", off = \"\";\n    const set = SETS[s.setIdx], kn = s.known[set.id] || {}, st = s.starred[set.id] || {};\n    const cur = s.queue.length ? set.cards.filter((c) => c.id === s.queue[s.pos])[0] : null;\n    const m = cur ? cur.example.match(/^(.*?)\\*(.+?)\\*(.*)$/) : null;\n    const card = cur ? { word: cur.word, pos: cur.pos, meaning: cur.meaning, trick: cur.trick, ua: cur.ua, es: cur.es, zh: cur.zh, pic: cur.pic || \"\", hasPic: !!cur.pic, hasTrick: !!cur.trick, exBefore: m ? m[1] : cur.example, exHl: m ? m[2] : \"\", exAfter: m ? m[3] : \"\" } : {};\n    const reset = (i) => this.setState({ setIdx: i, only: false, queue: bq(SETS[i].cards, {}, false), pos: 0, flipped: false, more: false });\n    const lines = D[s.d].lines.map((ln, li) => {\n      const toks = [];\n      ln[1].forEach((p, pi) => {\n        (s.gran === \"words\" ? p.split(\" \") : [p]).forEach((t, ti) => {\n          con queue.map((id, i) => ({ n: (st[id] ? \"★\" : \"\") + (i + 1), pick: () => this.setState({ pos: i, flipped: false, more: false }), style: \"width:38px;height:38px;display:grid;place-items:center;box-sizing:border-box;font:inherit;font-weight:800;font-size:15px;border-radius:4px;cursor:pointer;border:2px solid \" + (i === s.pos ? \"#14213d;background:#ffd84d;color:#14213d\" : (st[id] ? \"#b8860b;background:#fff7d6;color:#14213d\" : \"#cfd8e8;background:#fff;color:#52627f\")) })),\n      progressText: \"Card \" + (s.pos + 1) + \" of \" + s.queue.length + (s.only ? \" · starred only\" : \"\"),\n      gtiles,\n      gameTabs: [[\"match\", \"Matching\"], [\"memory\", \"Memory\"]].map((x) => ({ label: x[1], on: s.game === x[0], style: s.game === x[0] ? on : off, pick: () => this.setState(Object.assign({ game: x[0] }, gs(s.setIdx))) })),\n      gameSetTabs: SETS.map((x, i) => ({ label: x.label, on: s.setIdx === i, style: s.setIdx === i ? on : off, pick: () => { reset(i); this.setState(gs(i)); } })),\n      newGame: () => this.setState(gs(s.setIdx)),\n      gameStatus: won ? \"All matched in \" + s.tries + \" tries. Well done!\" : (mem ? \"Flip two tiles to find a word and its meaning.\" : \"Tap a word, then its meaning.\") + \" Tries: \" + s.tries,\n      isStarred: !!(cur && st[cur.id]), starIcon: cur && st[cur.id] ? \"★\" : \"☆\",\n      starStyle: \"min-width:44px;padding:4px 10px;font-size:24px;line-height:1;border:1px solid \" + (cur && st[cur.id] ? \"#b8860b;background:#ffd84d;color:#14213d\" : \"#9fb0d0;background:#fff;color:#52627f\"),\n      toggleStar: () => { if (!cur) return; const a = Object.assign({}, this.state.starred); a[set.id] = Object.assign({}, st); if (a[set.id][cur.id]) delete a[set.id][cur.id]; else a[set.id][cur.id] = true; this.setState({ starred: a }); },\n      only: s.only, onlyLabel: \"★ Starred only (\" + Object.keys(st).length + \")\", onlyStyle: s.only ? on : off, onlyDisabled: !s.only && Object.keys(st).length === 0,\n      toggleOnly: () => { const o = !this.state.only; this.setState({ only: o, queue: bq(set.cards, ex(set, o, st), false), pos: 0, flipped: false, more: false }); },\n      inPlay: !!cur, isDone: !cur,\n      card, tagText: s.flipped || s.mode === \"word\" ? (cur ? cur.pos : \"\") : \"Which word?\",\n      showFrontWord: !!cur && front && s.mode === \"word\", showFrontMeaning: !!cur && front && s.mode === \"meaning\",\n      isBack: !!cur && s.flipped, notFlipped: front,\n      flipLabel: s.flipped ? \"Flip back\" : \"Flip card\",\n      flip: () => this.setState({ flipped: !this.state.flipped }),\n      moreOpen: s.more, moreLabel: s.more ? \"Less\" : \"More\",\n      toggleMore: () => this.setState({ more: !this.state.more }),\n      prev: () => { if (this.state.pos > 0) this.setState({ pos: this.state.pos - 1, flipped: false, more: false }); },\n      next: () => { if (this.state.pos < this.state.queue.length - 1) this.setState({ pos: this.state.pos + 1, flipped: false, more: false }); },\n      atStart: s.pos === 0, atEnd: s.pos >= s.queue.length - 1,\n      \n      doneNote: s.retries ? s.retries + \" time\" + (s.retries === 1 ? \"\" : \"s\") + \" a card needed another look. That is how memory works.\" : \"You knew every card the first time.\",\n      lines,\n      tabs: D.map((x, i) => ({ label: x.name, on: s.d === i, style: s.d === i ? on : off, pick: () => this.setState({ d: i, hidden: {} }) })),\n      grans: [[\"phrases\", \"Phrases\"], [\"words\", \"Single words\"]].map((g) => ({ label: g[1], on: s.gran === g[0], style: s.gran === g[0] ? on : off, pick: () => this.setState({ gran: g[0], hidden: {} }) })),\n      hideAll: () => { const n = {}; keys.forEach((k) => { n[k] = true; }); this.setState({ hidden: n }); },\n      showAll: () => this.setState({ hidden: {} }),\n      hideSome: () => { const n = Object.assign({}, this.state.hidden); keys.forEach((k) => { if (Math.random() < 0.3) n[k] = true; }); this.setState({ hidden: n }); },\n      countText: hc + \" of \" + keys.lengt
